<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Houssam Nadir, genie informatique, Polytechnique Montreal, disponible pour un stage en 2027">
  <defs>
    <radialGradient id="glow" cx="0.74" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#FFB225" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#FFB225" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFB225" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB225"/>
      <stop offset="70%" stop-color="#EA9307" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#EA9307" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0F0C08"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- champ topographique, echo du fond anime du portfolio -->
    <g fill="none" stroke="#FFB225" stroke-width="1" opacity="0.12">
      <path d="M-40.0 308.0 C 160.0 276.0, 300.0 332.0, 470.0 300.0 S 800.0 254.0, 1000.0 288.0 S 1180.0 308.0, 1240.0 294.0"/>
      <path d="M-40.0 326.0 C 170.0 298.0, 320.0 352.0, 500.0 322.0 S 820.0 278.0, 1020.0 310.0 S 1190.0 328.0, 1240.0 316.0"/>
      <path d="M-40.0 290.0 C 150.0 256.0, 290.0 314.0, 450.0 280.0 S 780.0 232.0, 980.0 266.0 S 1170.0 288.0, 1240.0 272.0"/>
    </g>
    <path d="M-40.0 308.0 C 160.0 276.0, 300.0 332.0, 470.0 300.0 S 800.0 254.0, 1000.0 288.0 S 1180.0 308.0, 1240.0 294.0"
          fill="none" stroke="#FFB225" stroke-width="1.7" opacity="0.40"/>
    <g fill="#EA9307" opacity="0.7">
      <circle cx="470" cy="300" r="3"/><circle cx="820" cy="266" r="3"/><circle cx="1120" cy="300" r="3"/>
    </g>

    <!-- trame de points -->
    <g fill="#EA9307" opacity="0.15">
      <circle cx="1064" cy="92" r="1.6"/><circle cx="1104" cy="92" r="1.6"/><circle cx="1144" cy="92" r="1.6"/>
      <circle cx="1064" cy="132" r="1.6"/><circle cx="1104" cy="132" r="1.6"/><circle cx="1144" cy="132" r="1.6"/>
      <circle cx="1064" cy="172" r="1.6"/><circle cx="1104" cy="172" r="1.6"/><circle cx="1144" cy="172" r="1.6"/>
    </g>

    <!-- barre de fenetre -->
    <rect x="0" y="0" width="1200" height="44" fill="#191510"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#3A342C" stroke-width="1"/>
    <circle cx="28" cy="22" r="5.5" fill="#B34A2A"/>
    <circle cx="48" cy="22" r="5.5" fill="#FFB225"/>
    <circle cx="68" cy="22" r="5.5" fill="#3FB984"/>
    <text x="96" y="27" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#B1ADA9">~/houssam-nadir</text>
    <text x="1104" y="27" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8C877F" text-anchor="end">MONTRÉAL · UTC-5</text>

    <!-- disponibilite -->
    <circle cx="76" cy="98" r="4.5" fill="#3FB984"/>
    <text x="92" y="103" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#FFB225">DISPONIBLE · STAGE 2027</text>

    <!-- nom : un seul bloc de texte, les tspans s'enchainent sans se chevaucher -->
    <text x="72" y="182" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">
      <tspan fill="#F7F5F2">Houssam </tspan><tspan fill="none" stroke="#FFB225" stroke-width="1.6">Nadir</tspan><tspan fill="#FFB225">.</tspan>
    </text>

    <line x1="72" y1="212" x2="640" y2="212" stroke="url(#rule)" stroke-width="2"/>

    <text x="72" y="244" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#B1ADA9">Génie informatique · Polytechnique Montréal</text>
    <text x="72" y="276" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#FFB225">$ trois produits en production, seul</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#3A342C"/>
</svg>
